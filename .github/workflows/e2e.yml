name: End-to-End

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  ios-runtime-smoke:
    name: iOS runtime smoke
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            example/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Create and boot iOS simulator
        run: |
          set -euo pipefail
          device_id="$(
            xcrun simctl create \
              lib_mlx_e2e \
              "iPhone 16" \
              "com.apple.CoreSimulator.SimRuntime.iOS-18-5"
          )"
          echo "IOS_SIMULATOR_ID=${device_id}" >> "$GITHUB_ENV"
          xcrun simctl boot "${device_id}"
          xcrun simctl bootstatus "${device_id}" -b

      - name: Run iOS example E2E test
        working-directory: example
        run: flutter test integration_test/e2e_smoke_test.dart -d "$IOS_SIMULATOR_ID"

      - name: Delete iOS simulator
        if: always()
        run: |
          if [[ -n "${IOS_SIMULATOR_ID:-}" ]]; then
            xcrun simctl delete "$IOS_SIMULATOR_ID"
          fi
