name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 1.2.3). Leave empty to release pubspec.yaml version.
        required: false
        type: string
      git_ref:
        description: Git ref to release from
        required: true
        default: main
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || inputs.git_ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  release:
    name: Validate, tag, and publish release
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Resolve release version
        id: release_version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            version="${REQUESTED_VERSION#v}"
          else
            version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: ${version}"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update package versions
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          perl -0pi -e 's/^version: .+$/version: $ENV{VERSION}/m' pubspec.yaml
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          podspec = Path("ios/lib_mlx.podspec")
          text = podspec.read_text()
          text = re.sub(
              r"(s\.version\s*=\s*['\"])[^'\"]+(['\"])",
              rf"\g<1>{version}\2",
              text,
              count=1,
          )
          podspec.write_text(text)
          PY

      - name: Install Dart and Flutter dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze .

      - name: Run Flutter tests
        run: flutter test test

      - name: Run Swift tests
        run: swift test

      - name: Build iOS SwiftPM package
        working-directory: ios/lib_mlx
        run: swift build

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build iOS simulator example
        working-directory: example
        run: flutter build ios --simulator --debug

      - name: Validate pub package
        run: flutter pub publish --dry-run --ignore-warnings

      - name: Create release artifacts
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          tar -czf "dist/release/lib_mlx-source-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='.build' \
            --exclude='.swiftpm' \
            --exclude='.dart_tool' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='dist' \
            --exclude='ios/lib_mlx/.build' \
            --exclude='ios/lib_mlx/.swiftpm' \
            --exclude='example/.dart_tool' \
            --exclude='example/build' \
            --exclude='example/ios/Flutter/ephemeral' \
            --exclude='example/ios/Flutter/Generated.xcconfig' \
            --exclude='example/ios/Flutter/flutter_export_environment.sh' \
            .
          (
            cd dist/release
            shasum -a 256 "lib_mlx-source-${VERSION}.tar.gz" \
              > "lib_mlx-source-${VERSION}.tar.gz.sha256"
          )

      - name: Commit version bump
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          git add pubspec.yaml ios/lib_mlx.podspec
          if git diff --cached --quiet; then
            echo "Package versions are already set to v${VERSION}."
          else
            git commit -m "chore(release): v${VERSION}"
          fi
          git push origin "HEAD:${{ inputs.git_ref }}"

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/release/* \
            --target "$(git rev-parse HEAD)" \
            --generate-notes \
            --title "v${VERSION}"

      - name: Dispatch OIDC pub.dev publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          gh workflow run publish.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "v${VERSION}" \
            -f version="${VERSION}" \
            -f git_ref="v${VERSION}"
