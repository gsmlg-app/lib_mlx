name: Publish to pub.dev

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version or tag
        required: true
        type: string
      git_ref:
        description: Git ref with matching signed standalone Release evidence
        required: true
        default: main
        type: string
      evidence_run_id:
        description: Successful real-model e2e.yml run containing both platforms for this commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.8'
  FLUTTER_SWIFT_PACKAGE_MANAGER: 'true'
  PUBLISH_TAG: ${{ inputs.version }}
  LIB_MLX_MACOS_REPORT: build/release-evidence/macos-report.json
  LIB_MLX_IOS_REPORT: build/release-evidence/ios-report.json

jobs:
  publish:
    name: Gate real-model evidence and publish lib_mlx
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - name: Validate requested version and evidence provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        run: |
          set -euo pipefail
          version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          test "$version" = "${PUBLISH_TAG#v}"
          [[ "$EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN_ID" > "$RUNNER_TEMP/evidence-run.json"
          python3 - "$RUNNER_TEMP/evidence-run.json" "$(git rev-parse HEAD)" <<'PY'
          import json, os, sys
          run = json.load(open(sys.argv[1]))
          if run.get('path') != '.github/workflows/e2e.yml': raise SystemExit('Evidence must come from e2e.yml')
          if run.get('event') != 'workflow_dispatch' or run.get('conclusion') != 'success': raise SystemExit('Evidence workflow must finish successfully')
          if run.get('head_sha') != sys.argv[2]: raise SystemExit('Evidence workflow must match this exact commit')
          if run.get('head_repository', {}).get('full_name') != os.environ['GITHUB_REPOSITORY']: raise SystemExit('Evidence must belong to this repository')
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          pattern: flutter-release-*-report
          merge-multiple: true
          path: build/release-evidence
      - run: python3 tool/release_gate.py
      - name: Setup Dart OIDC credentials after the evidence gate
        uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub publish --dry-run
      - name: Publish lib_mlx
        env:
          PACKAGE: lib_mlx
        run: |
          set -euo pipefail
          python3 tool/release_gate.py
          version="${PUBLISH_TAG#v}"
          status="$(curl -sS -o "$RUNNER_TEMP/package.json" -w '%{http_code}' "https://pub.dev/api/packages/${PACKAGE}")"
          if [[ "$status" == 404 ]]; then
            echo 'Package is unpublished; use the gated first-publish workflow.' >&2
            exit 1
          fi
          test "$status" = 200 || { echo "pub.dev returned HTTP $status" >&2; exit 1; }
          published="$(VERSION="$version" python3 -c 'import json,os,sys; print("yes" if any(item["version"] == os.environ["VERSION"] for item in json.load(open(sys.argv[1])).get("versions", [])) else "no")' "$RUNNER_TEMP/package.json")"
          if [[ "$published" == yes ]]; then
            echo "${PACKAGE} ${version} is already published; skipping."
            exit 0
          fi
          flutter pub publish --force

  fresh-pub-build:
    name: Fresh published-package Flutter Release compilation
    runs-on: macos-26
    needs: publish
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve published version and compile both Release hosts (no runtime proof)
        shell: bash
        run: |
          set -euo pipefail
          version="${PUBLISH_TAG#v}"
          printf 'CODE_SIGNING_ALLOWED = NO\nCODE_SIGNING_REQUIRED = NO\nCODE_SIGN_IDENTITY = -\nCODE_SIGN_STYLE = Manual\nDEVELOPMENT_TEAM =\nEXCLUDED_ARCHS = x86_64\n' > "$RUNNER_TEMP/lib-mlx-unsigned.xcconfig"
          export XCODE_XCCONFIG_FILE="$RUNNER_TEMP/lib-mlx-unsigned.xcconfig"
          app_dir="$(mktemp -d "$RUNNER_TEMP/lib_mlx_pub_smoke.XXXXXX")"
          flutter create --platforms=ios,macos "$app_dir"
          cd "$app_dir"
          python3 - <<'PY'
          import re
          from pathlib import Path
          for name, setting, target in [('ios', 'IPHONEOS_DEPLOYMENT_TARGET', '17.0'), ('macos', 'MACOSX_DEPLOYMENT_TARGET', '14.0')]:
              project = Path(name) / 'Runner.xcodeproj/project.pbxproj'
              project.write_text(re.sub(rf'{setting} = [0-9.]+;', f'{setting} = {target};', project.read_text()))
          PY
          for attempt in {1..40}; do
            if flutter pub add "lib_mlx:$version"; then break; fi
            if [[ "$attempt" == 40 ]]; then echo "Published version $version is not resolvable" >&2; exit 1; fi
            sleep 15
          done
          flutter build macos --release
          flutter build ios --release --no-codesign
