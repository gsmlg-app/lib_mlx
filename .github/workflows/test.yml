name: Focused tests

on:
  workflow_dispatch:

env:
  FLUTTER_SWIFT_PACKAGE_MANAGER: 'true'

permissions:
  contents: read

jobs:
  tests:
    name: Swift and public Dart protocol tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: python3 tool/package_manifests.py --check
      - run: swift test --jobs 2
      - run: flutter pub get
      - run: swift build --jobs 2 --product ProtocolTestHost
      - run: LIB_MLX_PROTOCOL_HOST="$GITHUB_WORKSPACE/.build/debug/ProtocolTestHost" flutter test test
