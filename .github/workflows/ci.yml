name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'
  FLUTTER_SWIFT_PACKAGE_MANAGER: 'true'

jobs:
  dart:
    name: Dart format, analysis, tests, and package validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze .
      - run: flutter test test
      - run: python3 tool/package_manifests.py --check
      - run: python3 -m unittest -v tool.test_release_gate
      - run: flutter pub publish --dry-run

  apple:
    name: Swift protocol, Release ABI, and Flutter Release compilation
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify hosted toolchain (Swift 6.3 or newer)
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
          swift --version | python3 -c 'import re,sys; v=re.search(r"Swift version (\d+)\.(\d+)",sys.stdin.read()); sys.exit(0 if v and tuple(map(int,v.groups())) >= (6,3) else "Swift 6.3+ is required")'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: python3 tool/package_manifests.py --check
      - name: Controlled Swift protocol and lifecycle tests
        run: swift test --jobs 2
      - name: Preserve JSON integer boundaries
        run: |
          swiftc darwin/lib_mlx/Sources/MlxCore/CoreTypes.swift tool/json_value_smoke.swift -o "$RUNNER_TEMP/json-value-smoke"
          "$RUNNER_TEMP/json-value-smoke"
      - run: flutter pub get
      - name: Release FFI ABI through public Dart bindings
        run: |
          swift build --jobs 2 -c release --product MlxRuntimeFFI
          dart run tool/abi_smoke.dart .build/release/libMlxRuntimeFFI.dylib
      - name: Public Dart client to controlled Swift protocol host
        run: |
          swift build --jobs 2 --product ProtocolTestHost
          LIB_MLX_PROTOCOL_HOST="$GITHUB_WORKSPACE/.build/debug/ProtocolTestHost" flutter test test/swift_protocol_integration_test.dart
      - name: Resolve Flutter example
        working-directory: example
        run: flutter pub get
      - name: Prepare unsigned hosted compilation settings
        run: printf 'CODE_SIGNING_ALLOWED = NO\nCODE_SIGNING_REQUIRED = NO\nCODE_SIGN_IDENTITY = -\nCODE_SIGN_STYLE = Manual\nDEVELOPMENT_TEAM =\nEXCLUDED_ARCHS = x86_64\n' > "$RUNNER_TEMP/lib-mlx-unsigned.xcconfig"
      - name: Compile unsigned Flutter macOS Release (no runtime evidence)
        env:
          XCODE_XCCONFIG_FILE: ${{ runner.temp }}/lib-mlx-unsigned.xcconfig
        working-directory: example
        run: flutter build macos --release
      - name: Compile Flutter iOS device SDK Release, unsigned (no device evidence)
        working-directory: example
        run: flutter build ios --release --no-codesign
